name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # Includes prop_round_trip_bytes and prop_matches_tiktoken_rs.
    # Those tests default to 10_000 cases. PROPTEST_CASES overrides that
    # (proptest's Config::default reads it; the tests keep the override
    # instead of forcing 10_000). Fuzzing is not run here: `fuzz_encode`
    # needs nightly and a long local run (`cargo +nightly fuzz run`).
    - name: Run tests
      run: cargo test --verbose
